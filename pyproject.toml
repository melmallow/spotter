[project]
name = "spotter"
version = "0.1.0"
description = "LangGraph multi-agent fitness coach — Future Research take-home"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Melissa Hargis", email = "melissa.k.hargis@gmail.com" }]
dependencies = [
    "langgraph>=0.6,<1",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "structlog>=24.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spotter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
